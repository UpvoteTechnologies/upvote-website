[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# No SPA catch-all: every route is a prerendered HTML file, and unknown paths fall through to
# dist/404.html with a real 404 status.
